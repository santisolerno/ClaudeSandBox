server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta no-archivo cae a index.html (React Router friendly).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash en el nombre (Vite los emite así).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
